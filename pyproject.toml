[build-system]
# Pin <1.27 to keep Metadata-Version 2.3 (PyPI doesn't accept 2.4's
# License-File field yet, as of 2026-05).
requires = ["hatchling>=1.18,<1.27"]
build-backend = "hatchling.build"

[project]
name = "depth-lens"
version = "1.0.0"
description = "Measure and visualize reasoning depth across model families (looped transformers, extended-thinking APIs, agent loops)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "yutoTachibana" }]
keywords = [
    "looped-transformer",
    "reasoning",
    "inference-time-scaling",
    "extended-thinking",
    "benchmark",
    "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.7",
    "torch>=2.4",
    "pydantic>=2.6",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
openmythos = ["open-mythos>=0.5"]
huggingface = ["transformers>=4.40"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
vllm = ["openai>=1.40"]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=8", "ruff>=0.5", "pytest-cov>=5"]

[project.scripts]
depth-lens = "depth_lens.cli:cli"

[project.urls]
Repository = "https://github.com/yutoTachibana/depth-lens"

[tool.hatch.build.targets.wheel]
packages = ["depth_lens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
