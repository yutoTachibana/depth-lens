[build-system]
# Pin <1.27 to keep Metadata-Version 2.3 (PyPI doesn't accept 2.4's
# License-File field yet, as of 2026-05).
requires = ["hatchling>=1.18,<1.27"]
build-backend = "hatchling.build"

[project]
name = "depth-lens"
version = "1.2.0"
description = "Cost-vs-accuracy CI for LLM ops. Pick the cheapest API tier, compare self-hosted vLLM vs cloud APIs on one Pareto, and benchmark looped transformers vs token-level CoT — all on your own data with Wilson 95% CIs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "yutoTachibana" }]
keywords = [
    "llm",
    "llm-evaluation",
    "inference-compute",
    "cost-optimization",
    "build-vs-buy",
    "vllm",
    "anthropic",
    "openai",
    "gemini",
    "looped-transformer",
    "extended-thinking",
    "benchmark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.7",
    "pydantic>=2.6",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# torch is required for the openmythos and huggingface adapters; keeping it
# out of base dependencies so API-only users don't pull ~2GB of CUDA libs.
openmythos = ["open-mythos>=0.5", "torch>=2.4"]
huggingface = ["transformers>=4.40", "torch>=2.4"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
vllm = ["openai>=1.40"]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=8", "ruff>=0.5", "pytest-cov>=5"]

[project.scripts]
depth-lens = "depth_lens.cli:cli"

[project.urls]
Repository = "https://github.com/yutoTachibana/depth-lens"

[tool.hatch.build.targets.wheel]
packages = ["depth_lens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
