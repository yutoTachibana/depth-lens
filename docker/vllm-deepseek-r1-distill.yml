services:
  vllm-deepseek-r1-distill:
    # 1.5B is chosen so the model fits a 16 GB consumer GPU (4080 SUPER)
    # with enough headroom for a meaningful KV cache. The 7B variant in
    # fp16 needs ~14 GB for weights alone and leaves negative KV cache
    # room — see depth-lens v1.2 finding for the OOM trace. For larger
    # GPUs swap in deepseek-ai/DeepSeek-R1-Distill-Qwen-7B.
    image: vllm/vllm-openai:latest
    container_name: vllm-deepseek-r1-distill
    runtime: nvidia
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${HOME:-/root}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.85"
      - --dtype
      - half
      - --reasoning-parser
      - deepseek_r1
